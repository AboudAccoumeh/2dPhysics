<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>physic engine demo</title>
	<link rel="stylesheet" href="css/style.css">
</head>
<body>
	<main class="demo">
		<canvas id="canvas"></canvas>
		<section class="controls" aria-label="Physics settings">
			<label class="control">
				<span class="control-name">Friction</span>
				<input id="friction" type="range" min="0" max="1" step="0.05" value="0.3">
				<output id="friction-value" for="friction"></output>
			</label>
			<label class="control">
				<span class="control-name">Bounciness</span>
				<input id="restitution" type="range" min="0" max="1" step="0.05" value="0.4">
				<output id="restitution-value" for="restitution"></output>
			</label>
		</section>
	</main>
	<script src="js/vec2.js"></script>
	<script src="js/bodies.js"></script>
	<script src="js/collision.js"></script>
	<script src="js/world.js"></script>
	<script src="js/renderer.js"></script>
	<script src="js/main.js"></script>
</body>
</html>
